version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: infragpt
      POSTGRES_PASSWORD: infragpt
      POSTGRES_DB: infragpt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infragpt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      DATABASE_URL: postgresql://infragpt:infragpt@db:5432/infragpt
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-dev-secret-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
